version: '3.8'

services:
  pai-ai-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pai-ai-movie-studio
    restart: unless-stopped
    ports:
      # Bound to this machine only. To reach the dashboard from your LAN/phone, change to
      # "5000:5000" AND set WEB_UI_PASSWORD (the server prints a random token if you forget).
      - "127.0.0.1:5000:5000"
    volumes:
      # Persistent storage mounts
      - ./movies:/app/movies
      - ./outputs:/app/outputs
      - ./temp:/app/temp
      # NOTE: create these two files on the host first (copy config.example.json / cookies.example.txt),
      # otherwise Docker creates *directories* with those names. They are intentionally NOT baked
      # into the image (see .dockerignore).
      - ./config.json:/app/config.json
      - ./cookies.txt:/app/cookies.txt
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      # Strongly recommended: export WEB_UI_PASSWORD before `docker compose up`
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD:-}
    # Optional NVIDIA GPU acceleration (uncomment if NVIDIA Container Toolkit is installed)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
